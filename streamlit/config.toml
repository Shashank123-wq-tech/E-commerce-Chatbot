# .streamlit/config.toml
# Streamlit server & UI configuration

[server]
headless       = true          # required for Streamlit Cloud / Docker
enableCORS     = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false       # opt out of Streamlit telemetry

[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
font = "sans serif"
 
[server]
headless = true
enableCORS = false
